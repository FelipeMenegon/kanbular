services:
  db:
    image: postgres:17
    container_name: kanbular-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanbular
      POSTGRES_PASSWORD: kanbular
      POSTGRES_DB: kanbular
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: