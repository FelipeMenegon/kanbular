<div class="task-container cdkDragHandle">
    <div class="task">
        <div class="task-header">
            <h3>{{ task.title }}</h3>
            <p>{{ task.createdAt | date:'short' }}</p>
        </div>
        <p>{{ task.description }}</p>
        <span [class]="task.priority">
            {{ priorityLabels[task.priority] }}
        </span>
    </div>
</div>
