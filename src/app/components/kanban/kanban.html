<div class="header">
  <h1>Área Central</h1>
</div>

<div class="cards">
  <div class="card">
    <a>Backlog</a>
    <button class="icon-button">
      <span class="material-symbols-outlined"> more_vert </span>
    </button>
    @for (task of taskService.tasks(); track task.id) {
    <app-task [task]="task"></app-task>
    }
  </div>

  <div class="card">
    <a>A Fazer</a>
    <button class="icon-button">
      <span class="material-symbols-outlined"> more_vert </span>
    </button>

    @for (task of taskService.tasks(); track task.id) {
    <app-task [task]="task"></app-task>
    }
  </div>

  <div class="card">
    <a>Em Andamento</a>
    <button class="icon-button">
      <span class="material-symbols-outlined"> more_vert </span>
    </button>
    @for (task of taskService.tasks() ; track task.id) {
    <app-task [task]="task"></app-task>
    }
  </div>

  <div class="card">
    <a>Concluído</a>
    <button class="icon-button">
      <span class="material-symbols-outlined"> more_vert </span>
    </button>
    @for (task of taskService.tasks() ; track task.id) {
    <app-task [task]="task"></app-task>
    }
  </div>
</div>
